name: photoe_zi
description: "Instant Tether & Film Simulation Mobile App (PhotoE-Zi)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0-276.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ^4.3.0
  exif: ^3.3.0
  uuid: ^4.5.1
  file_picker: ^8.1.4
  qr_flutter: ^4.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/luts/
  shaders:
    - shaders/lut_3d.frag
